name: Tests

on:
  push:
    branches:
      - master
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_ccss
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Copy environment file
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env

      - name: Lint PHP files
        run: find api index.php -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Load database schema and seed data
        run: |
          mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot db_ccss < api/config/schema.sql
          mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot db_ccss < api/config/seed.sql
